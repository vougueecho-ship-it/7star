<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Deposits — Admin Panel</title>
  <link rel="stylesheet" href="/css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar" style="border-bottom-color: var(--primary-gold);">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <img src="/images/logo.png" alt="7 Star Logo">
        <span style="color: var(--primary-gold);">ADMIN PANEL</span>
      </a>
      <a href="/admin/index.html" class="btn btn-outline btn-sm">Overview</a>
    </div>
  </header>

  <div class="container" style="padding: 2rem 1.25rem;">
    
    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 2rem; background: var(--bg-card); padding: 0.85rem; border-radius: 12px;">
      <a href="/admin/index.html" class="btn btn-outline btn-sm">📊 Overview</a>
      <a href="/admin/deposits.html" class="btn btn-gold btn-sm">💳 Deposits</a>
      <a href="/admin/withdrawals.html" class="btn btn-outline btn-sm">💸 Withdrawals</a>
      <a href="/admin/settings.html" class="btn btn-outline btn-sm">⚙️ Account Settings</a>
      <a href="/admin/users.html" class="btn btn-outline btn-sm">👥 User Manager</a>
    </div>

    <div class="glass-card">
      <h2 style="color: var(--primary-gold); margin-bottom: 1.5rem;">User Deposit Requests (Easypaisa / JazzCash)</h2>
      
      <div style="overflow-x: auto;">
        <table class="custom-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>User Name & Phone</th>
              <th>Amount</th>
              <th>Gateway</th>
              <th>Trx ID (TID)</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="adm-deposits-table">
            <!-- Rendered dynamically by admin.js -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
