<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gateway & Site Settings — Admin Panel</title>
  <link rel="stylesheet" href="/css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar" style="border-bottom-color: var(--primary-gold);">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <img src="/images/logo.png" alt="7 Star Logo">
        <span style="color: var(--primary-gold);">ADMIN PANEL</span>
      </a>
      <a href="/admin/index.html" class="btn btn-outline btn-sm">Overview</a>
    </div>
  </header>

  <div class="container" style="max-width: 700px; padding: 2rem 1.25rem;">
    
    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 2rem; background: var(--bg-card); padding: 0.85rem; border-radius: 12px;">
      <a href="/admin/index.html" class="btn btn-outline btn-sm">📊 Overview</a>
      <a href="/admin/deposits.html" class="btn btn-outline btn-sm">💳 Deposits</a>
      <a href="/admin/withdrawals.html" class="btn btn-outline btn-sm">💸 Withdrawals</a>
      <a href="/admin/settings.html" class="btn btn-gold btn-sm">⚙️ Account Settings</a>
      <a href="/admin/users.html" class="btn btn-outline btn-sm">👥 User Manager</a>
    </div>

    <div class="glass-card">
      <h2 style="color: var(--primary-gold); margin-bottom: 1.5rem;">Official Gateway & Notice Settings</h2>
      
      <form onsubmit="saveAdminSettings(event)">
        
        <h3 style="color: #fff; margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border-cyan); padding-bottom: 0.5rem;">Easypaisa Account Details</h3>
        <div class="form-group">
          <label class="form-label">Easypaisa Account Title</label>
          <input type="text" id="sett-ep-title" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Easypaisa Account Number</label>
          <input type="text" id="sett-ep-num" class="form-control" required>
        </div>

        <h3 style="color: #fff; margin-top: 2rem; margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border-cyan); padding-bottom: 0.5rem;">JazzCash Account Details</h3>
        <div class="form-group">
          <label class="form-label">JazzCash Account Title</label>
          <input type="text" id="sett-jc-title" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">JazzCash Account Number</label>
          <input type="text" id="sett-jc-num" class="form-control" required>
        </div>

        <h3 style="color: #fff; margin-top: 2rem; margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border-cyan); padding-bottom: 0.5rem;">Live Announcement Marquee</h3>
        <div class="form-group">
          <label class="form-label">Notice Bar Text</label>
          <textarea id="sett-notice" class="form-control" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-gold btn-full" style="margin-top: 1rem;">Save Settings</button>
      </form>
    </div>

  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
