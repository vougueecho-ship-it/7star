<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — 7 STAR INVEST</title>
  <link rel="stylesheet" href="/css/app-theme.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header Brand Card -->
    <div class="app-header">
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <div style="width:44px; height:44px; border-radius:16px; background:#f4f8f6; border:1px solid #e2e8f0; color:var(--primary-teal); font-weight:800; font-size:1.2rem; display:flex; align-items:center; justify-content:center;">
          ⭐
        </div>
        <div>
          <div style="font-weight:800; font-size:1.05rem; color:var(--primary-gold);">7 STAR</div>
          <div style="font-size:0.7rem; color:var(--primary-teal); font-weight:700;">7 STAR</div>
        </div>
      </div>
      <a href="/login.html" style="background:#ffffff; color:var(--primary-teal); border:1px solid #e2e8f0; padding:0.45rem 1rem; border-radius:20px; text-decoration:none; font-size:0.8rem; font-weight:800; display:flex; align-items:center; gap:0.4rem; box-shadow:0 2px 6px rgba(0,0,0,0.04);">
        ➜] Login
      </a>
    </div>

    <!-- Forgot Password Card -->
    <div class="auth-card" style="border-radius:28px; padding:2.25rem 1.5rem;">
      <h1 class="auth-title">RESET PASSWORD</h1>
      <p style="text-align:center; color:var(--text-muted); font-size:0.9rem; margin-bottom:2rem;">Verify Email to reset password</p>

      <form onsubmit="handleForgotPassword(event)">
        
        <div style="margin-bottom:1.25rem;">
          <label style="font-size:0.75rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:0.4rem; letter-spacing:0.5px;">EMAIL ADDRESS</label>
          <div style="display:flex; gap:0.5rem;">
            <div class="auth-input-group" style="flex:1; margin-bottom:0;">
              <span class="auth-input-icon">📧</span>
              <input type="email" id="forgot-email" class="auth-input-field" placeholder="Enter email address" required>
            </div>
            <button type="button" onclick="sendForgotOtp(event)" id="btn-send-otp" class="btn-activate-gold" style="width:auto; padding:0 0.85rem; font-size:0.75rem; margin-top:0; border-radius:12px; white-space:nowrap; flex-shrink:0;">Send OTP</button>
          </div>
        </div>

        <div style="margin-bottom:1.25rem;">
          <label style="font-size:0.75rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:0.4rem; letter-spacing:0.5px;">EMAIL OTP CODE</label>
          <div class="auth-input-group">
            <span class="auth-input-icon">🔑</span>
            <input type="text" id="forgot-otp" class="auth-input-field" placeholder="Enter 6-digit OTP code" required>
          </div>
        </div>

        <div style="margin-bottom:1.5rem;">
          <label style="font-size:0.75rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:0.4rem; letter-spacing:0.5px;">NEW PASSWORD</label>
          <div class="auth-input-group">
            <span class="auth-input-icon">🔒</span>
            <input type="password" id="forgot-new-password" class="auth-input-field" placeholder="Create new password" required>
            <span onclick="togglePasswordVisibility('forgot-new-password', this)" class="auth-input-eye">👁️</span>
          </div>
        </div>

        <button type="submit" class="btn-activate-gold">
          🔄 Reset Password
        </button>

      </form>

      <p style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-top:1.75rem;">
        Back to <a href="/login.html" style="color:var(--primary-teal); font-weight:800; text-decoration:none;">Login</a>
      </p>
    </div>

  </div>

  <script src="/js/app-client.js"></script>
</body>
</html>
