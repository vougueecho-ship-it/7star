<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    const _urlP = new URLSearchParams(window.location.search);
    if (!_urlP.get('ref') && localStorage.getItem('star_token')) {
      window.location.replace('/dashboard.html');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — 7 STAR INVEST</title>
  <link rel="stylesheet" href="/css/app-theme.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header Brand Card -->
    <div class="app-header">
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <div style="width:44px; height:44px; border-radius:16px; background:#f4f8f6; border:1px solid #e2e8f0; color:var(--primary-teal); font-weight:800; font-size:1.2rem; display:flex; align-items:center; justify-content:center;">
          ⭐
        </div>
        <div>
          <div style="font-weight:800; font-size:1.05rem; color:var(--primary-gold);">7 STAR</div>
          <div style="font-size:0.7rem; color:var(--primary-teal); font-weight:700;">7 STAR</div>
        </div>
      </div>
      <a href="/login.html" style="background:#ffffff; color:var(--primary-teal); border:1px solid #e2e8f0; padding:0.45rem 1rem; border-radius:20px; text-decoration:none; font-size:0.8rem; font-weight:800; display:flex; align-items:center; gap:0.4rem; box-shadow:0 2px 6px rgba(0,0,0,0.04);">
        ➜] Login
      </a>
    </div>

    <!-- Register Card -->
    <div class="auth-card" style="border-radius:28px; padding:2.25rem 1.5rem;">
      <h1 class="auth-title">CREATE ACCOUNT</h1>
      <p style="text-align:center; color:var(--text-muted); font-size:0.9rem; margin-bottom:2rem;">Join 7 STAR INVEST today</p>

      <form onsubmit="handleRegister(event)">
        
        <div style="margin-bottom:1.25rem;">
          <label style="font-size:0.75rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:0.4rem; letter-spacing:0.5px;">USERNAME</label>
          <div class="auth-input-group">
            <span class="auth-input-icon">👤</span>
            <input type="text" id="reg-username" class="auth-input-field" placeholder="Name, number or with spaces" required>
          </div>
        </div>

        <div style="margin-bottom:1.25rem;">
          <label style="font-size:0.75rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:0.4rem; letter-spacing:0.5px;">EMAIL ADDRESS</label>
          <div style="display:flex; gap:0.5rem;">
            <div class="auth-input-group" style="flex:1; margin-bottom:0;">
              <span class="auth-input-icon">📧</span>
              <input type="email" id="reg-email" class="auth-input-field" placeholder="Enter email address" required>
            </div>
            <button type="button" onclick="sendRegisterOtp(event)" id="btn-send-otp" class="btn-activate-gold" style="width:auto; padding:0 0.85rem; font-size:0.75rem; margin-top:0; border-radius:12px; white-space:nowrap; flex-shrink:0;">Send OTP</button>
          </div>
        </div>

        <div style="margin-bottom:1.25rem;">
          <label style="font-size:0.75rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:0.4rem; letter-spacing:0.5px;">EMAIL OTP CODE</label>
          <div class="auth-input-group">
            <span class="auth-input-icon">🔑</span>
            <input type="text" id="reg-otp" class="auth-input-field" placeholder="Enter 6-digit OTP code" required>
          </div>
        </div>

        <div style="margin-bottom:1.25rem;">
          <label style="font-size:0.75rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:0.4rem; letter-spacing:0.5px;">PHONE</label>
          <div class="auth-input-group">
            <span class="auth-input-icon">📞</span>
            <input type="text" id="reg-phone" class="auth-input-field" placeholder="Enter phone number" required>
          </div>
        </div>

        <div style="margin-bottom:1.25rem;">
          <label style="font-size:0.75rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:0.4rem; letter-spacing:0.5px;">PASSWORD</label>
          <div class="auth-input-group">
            <span class="auth-input-icon">🔒</span>
            <input type="password" id="reg-password" class="auth-input-field" placeholder="Create password" required>
            <span onclick="togglePasswordVisibility('reg-password', this)" class="auth-input-eye">👁️</span>
          </div>
        </div>

        <div style="margin-bottom:1.5rem;">
          <label style="font-size:0.75rem; font-weight:800; color:var(--text-muted); display:block; margin-bottom:0.4rem; letter-spacing:0.5px;">REFERRAL CODE (OPTIONAL)</label>
          <div class="auth-input-group">
            <span class="auth-input-icon">🎁</span>
            <input type="text" id="reg-ref" class="auth-input-field" placeholder="Enter referral code">
          </div>
        </div>

        <button type="submit" class="btn-activate-gold">
          👤+ Create Account
        </button>

      </form>

      <!-- OR Divider -->
      <div style="display:flex; align-items:center; margin:1.5rem 0 1.25rem 0; color:var(--text-muted); font-size:0.75rem; font-weight:700;">
        <div style="flex:1; height:1px; background:#e2e8f0;"></div>
        <span style="padding:0 0.75rem; text-transform:uppercase; letter-spacing:1px; color:#94a3b8;">OR</span>
        <div style="flex:1; height:1px; background:#e2e8f0;"></div>
      </div>

      <!-- Google Official Declarative Sign-In Button -->
      <div style="margin-bottom:0.5rem; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; min-height:44px;">
        <div id="g_id_onload"
             data-client_id="1007065363081-r4bv8hn10586g1v6n2as7j9eh10rtgnc.apps.googleusercontent.com"
             data-callback="handleGoogleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="continue_with"
             data-shape="pill"
             data-logo_alignment="left"
             data-width="320">
        </div>
      </div>

      <p style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-top:1.75rem;">
        Already have an account? <a href="/login.html" style="color:var(--primary-teal); font-weight:800; text-decoration:none;">Sign In</a>
      </p>
    </div>

  </div>

  <script src="/js/app-client.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const ref = urlParams.get('ref') || localStorage.getItem('star_ref_code');
    if (ref && ref.toLowerCase() !== 'undefined' && ref.toLowerCase() !== 'null' && ref.toLowerCase() !== 'none' && ref.toLowerCase() !== 'false' && ref !== '0') {
      const cleanRef = ref.trim().toUpperCase();
      document.getElementById('reg-ref').value = cleanRef;
      localStorage.setItem('star_ref_code', cleanRef);
    } else {
      document.getElementById('reg-ref').value = '';
    }
  </script>
</body>
</html>
